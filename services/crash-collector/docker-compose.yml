services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://slide:${POSTGRES_PASSWORD:-change-me}@postgres:5432/slide_crashes
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-slide}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-now}
      S3_BUCKET: slide-crash-reports
      S3_SERVER_SIDE_ENCRYPTION: none
      ADMIN_TOKEN: ${ADMIN_TOKEN:-replace-this-admin-token}
      IP_HASH_SALT: ${IP_HASH_SALT:-replace-this-ip-hash-salt}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slide_crashes
      POSTGRES_USER: slide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slide -d slide_crashes"]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slide}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-now}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  minio-data:
