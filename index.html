<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hikari Studio - Galgame 可视化编辑器</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <button class="icon-button mobile-menu" data-action="toggle-sidebar" title="项目导航"><i data-lucide="panel-left"></i></button>
        <div class="brand-mark">H</div>
        <div><strong>Hikari Studio</strong><span>星海回声</span></div>
      </div>
      <div class="history-controls">
        <button class="icon-button" title="撤销"><i data-lucide="undo-2"></i></button>
        <button class="icon-button" title="重做"><i data-lucide="redo-2"></i></button>
      </div>
      <button class="search-trigger" data-action="open-search"><i data-lucide="search"></i><span>搜索台词、指令和素材...</span><kbd>Ctrl K</kbd></button>
      <div class="top-actions">
        <div class="save-state"><span></span>已保存</div>
        <button class="icon-button" data-action="show-toast" title="协作动态"><i data-lucide="bell"></i></button>
        <button class="avatar-button" title="创作者账户">K</button>
      </div>
    </header>

    <nav class="module-nav" aria-label="主功能">
      <div class="module-links">
        <button class="module-link active" data-page="script"><i data-lucide="notebook-pen"></i>剧本</button>
        <button class="module-link" data-page="assets"><i data-lucide="folder-open"></i>素材</button>
        <button class="module-link" data-page="map"><i data-lucide="git-branch"></i>叙事地图</button>
        <button class="module-link" data-page="characters"><i data-lucide="users"></i>角色</button>
        <button class="module-link" data-page="history"><i data-lucide="history"></i>历史</button>
      </div>
      <div class="module-actions">
        <button class="button ghost" data-action="debug"><i data-lucide="bug-play"></i>调试</button>
        <button class="button primary" data-action="publish"><i data-lucide="rocket"></i>发布游戏</button>
      </div>
    </nav>

    <main class="workspace">
      <aside class="project-sidebar" id="projectSidebar">
        <div class="sidebar-title"><span>剧本结构</span><button class="icon-button small" data-action="add-chapter" title="新建章节"><i data-lucide="plus"></i></button></div>
        <button class="project-select"><span class="project-cover">星</span><span><strong>星海回声</strong><small>故事模式 · 6 个章节</small></span><i data-lucide="chevrons-up-down"></i></button>
        <div class="tree-section">
          <div class="tree-heading"><span>章节</span><button class="icon-button tiny" title="章节运行设置"><i data-lucide="settings-2"></i></button></div>
          <div id="chapterTree"></div>
        </div>
        <div class="sidebar-footer">
          <div><span>剧本完成度</span><strong>37%</strong></div>
          <div class="progress"><span style="width:37%"></span></div>
          <small>4,826 字 · 预计 18 分钟</small>
        </div>
      </aside>

      <section id="pageContent" class="page-content"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"><i data-lucide="check-circle-2"></i><span>操作已完成</span></div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
