name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m unittest discover -s tests -v
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run test:e2e
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: dotnet publish launcher/Hikari.GameLauncher/Hikari.GameLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false --output launcher/dist/win-x64
      - run: python -m PyInstaller --noconfirm --clean --workpath build/pyinstaller --distpath dist HikariStudio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: HikariStudio-windows-preview
          path: dist/HikariStudio/
          if-no-files-found: error
