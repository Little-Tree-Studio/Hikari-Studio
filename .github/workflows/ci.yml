name: CI

on:
  push:
  pull_request:

jobs:
  crash-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/crash-collector/go.mod
          cache-dependency-path: services/crash-collector/go.sum
      - run: go test -race ./...
        working-directory: services/crash-collector
      - run: go vet ./...
        working-directory: services/crash-collector
      - run: docker build -t slide-crash-collector:test .
        working-directory: services/crash-collector
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: uv sync --extra build
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv run --no-sync python -m benchmarks.large_project_backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run benchmark:large-project
        working-directory: frontend
      - run: pnpm run test:e2e
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: dotnet publish launcher/Slide.GameLauncher/Slide.GameLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -p:SlideBrowserMode=system --output launcher/dist/win-x64/system
      - run: dotnet publish launcher/Slide.GameLauncher/Slide.GameLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -p:SlideBrowserMode=cefsharp --output launcher/dist/win-x64/cefsharp
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\SlideStudioNuitkaCache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock', 'scripts/build-editor.ps1') }}
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-editor.ps1 -SkipInstall -SkipLauncher
        env:
          SLIDE_NUITKA_CACHE: ${{ runner.temp }}\SlideStudioNuitkaCache
      - run: choco install innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -SkipEditor
      - uses: actions/upload-artifact@v4
        with:
          name: SlideStudio-windows-preview
          path: dist/SlideStudio/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SlideStudio-windows-installer
          path: dist/installer/Slide-Studio-Setup-*.exe
          if-no-files-found: error
