name: CI

on:
  push:
  pull_request:

jobs:
  crash-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
        working-directory: services/crash-collector
      - run: python -m unittest discover -s tests -v
        working-directory: services/crash-collector
        env:
          DATABASE_URL: postgresql://unused
          S3_ENDPOINT: http://unused
          S3_ACCESS_KEY: unused
          S3_SECRET_KEY: unused
          ADMIN_TOKEN: test-admin-token
          IP_HASH_SALT: test-ip-hash-salt
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.large_project_backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run benchmark:large-project
        working-directory: frontend
      - run: pnpm run test:e2e
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: dotnet publish launcher/Hikari.GameLauncher/Hikari.GameLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false --output launcher/dist/win-x64
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\HikariStudioNuitkaCache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements-build.txt', 'scripts/build-editor.ps1') }}
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-editor.ps1 -SkipInstall -SkipLauncher
        env:
          HIKARI_NUITKA_CACHE: ${{ runner.temp }}\HikariStudioNuitkaCache
      - run: choco install innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -SkipEditor
      - uses: actions/upload-artifact@v4
        with:
          name: HikariStudio-windows-preview
          path: dist/HikariStudio/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HikariStudio-windows-installer
          path: dist/installer/Hikari-Studio-Setup-*.exe
          if-no-files-found: error
