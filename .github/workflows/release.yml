name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  crash-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt
        working-directory: services/crash-collector
      - run: python -m unittest discover -s tests -v
        working-directory: services/crash-collector
        env:
          DATABASE_URL: postgresql://unused
          S3_ENDPOINT: http://unused
          S3_ACCESS_KEY: unused
          S3_SECRET_KEY: unused
          ADMIN_TOKEN: test-admin-token
          IP_HASH_SALT: test-ip-hash-salt

  build-release:
    needs: crash-collector
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m unittest discover -s tests -v
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run test:e2e
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - run: dotnet publish launcher/Hikari.GameLauncher/Hikari.GameLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false --output launcher/dist/win-x64
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\HikariStudioNuitkaCache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements-build.txt', 'scripts/build-editor.ps1') }}
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-editor.ps1 -SkipInstall -SkipLauncher
        env:
          HIKARI_NUITKA_CACHE: ${{ runner.temp }}\HikariStudioNuitkaCache
      - run: choco install innosetup --no-progress -y
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/build-installer.ps1 -Version $version -SkipEditor
          Compress-Archive -Path 'dist/HikariStudio/*' -DestinationPath "dist/Hikari-Studio-Portable-$version.zip" -CompressionLevel Optimal
      - name: Generate update manifest and checksums
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          python scripts/release_manifest.py --version $version --installer "dist/installer/Hikari-Studio-Setup-$version.exe" --portable "dist/Hikari-Studio-Portable-$version.zip" --repository '${{ github.repository }}' --tag '${{ github.ref_name }}' --output dist/release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hikari Studio ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Windows preview build. The installer is currently unsigned; verify `SHA256SUMS.txt` before installation.

            Microsoft Edge WebView2 Runtime is required. Ren'Py export remains best-effort and does not reproduce every Hikari runtime feature. Full content-level installed-build regression continues during the Beta cycle.
          files: |
            dist/installer/Hikari-Studio-Setup-*.exe
            dist/Hikari-Studio-Portable-*.zip
            dist/release/SHA256SUMS.txt
            dist/release/latest.json
