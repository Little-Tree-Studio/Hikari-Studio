name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  crash-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/crash-collector/go.mod
          cache-dependency-path: services/crash-collector/go.sum
      - run: go test -race ./...
        working-directory: services/crash-collector
      - run: go vet ./...
        working-directory: services/crash-collector

  build-release:
    needs: crash-collector
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: uv sync --extra build
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run test:e2e
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: dotnet publish launcher/Hikari.GameLauncher/Hikari.GameLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -p:HikariBrowserMode=system --output launcher/dist/win-x64/system
      - run: dotnet publish launcher/Hikari.GameLauncher/Hikari.GameLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -p:HikariBrowserMode=cefsharp --output launcher/dist/win-x64/cefsharp
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\HikariStudioNuitkaCache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock', 'scripts/build-editor.ps1') }}
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-editor.ps1 -SkipInstall -SkipLauncher
        env:
          HIKARI_NUITKA_CACHE: ${{ runner.temp }}\HikariStudioNuitkaCache
      - run: choco install innosetup --no-progress -y
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/build-installer.ps1 -Version $version -SkipEditor
          Compress-Archive -Path 'dist/HikariStudio/*' -DestinationPath "dist/Hikari-Studio-Portable-$version.zip" -CompressionLevel Optimal
      - name: Generate update manifest and checksums
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          uv run --no-sync python scripts/release_manifest.py --version $version --installer "dist/installer/Hikari-Studio-Setup-$version.exe" --portable "dist/Hikari-Studio-Portable-$version.zip" --repository '${{ github.repository }}' --tag '${{ github.ref_name }}' --output dist/release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hikari Studio ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Windows preview build. The installer is currently unsigned; verify `SHA256SUMS.txt` before installation.

            Microsoft Edge WebView2 Runtime is required. Ren'Py export remains best-effort and does not reproduce every Hikari runtime feature. Full content-level installed-build regression continues during the Beta cycle.
          files: |
            dist/installer/Hikari-Studio-Setup-*.exe
            dist/Hikari-Studio-Portable-*.zip
            dist/release/SHA256SUMS.txt
            dist/release/latest.json
